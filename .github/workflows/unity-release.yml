name: Unity Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release Slime Slayer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: player_unity/Library
          key: Library-${{ hashFiles('player_unity/Assets/**', 'player_unity/Packages/**', 'player_unity/ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Read Unity project version
        run: |
          GAME_VERSION=$(grep "bundleVersion:" player_unity/ProjectSettings/ProjectSettings.asset | head -1 | awk '{print $2}')
          echo "GAME_VERSION=$GAME_VERSION" >> "$GITHUB_ENV"

      - name: Validate tag matches Unity version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "Unity version: $GAME_VERSION"
          echo "Git tag version: $TAG_VERSION"

          if [ "$TAG_VERSION" != "$GAME_VERSION" ]; then
            echo "ERROR: Git tag v$TAG_VERSION does not match Unity version $GAME_VERSION"
            exit 1
          fi

      - name: Build Unity project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: player_unity
          unityVersion: 6000.6.0f1
          targetPlatform: StandaloneLinux64
          buildName: SlimeSlayer
          versioning: Custom
          version: ${{ env.GAME_VERSION }}

      - name: Package Linux build
        run: |
          cd build
          zip -r "../SlimeSlayer-v${GAME_VERSION}-Linux.zip" .

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "SlimeSlayer-v${GAME_VERSION}-Linux.zip" \
            --title "Slime Slayer $GITHUB_REF_NAME" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
